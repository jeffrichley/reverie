# Root pyproject — reverie workspace (uv).
# Member packages live under packages/*. Each owns its [project] metadata.
# This file holds: workspace declaration, dev deps, shared ruff/mypy/pytest config.
#
# Conforms to canonical-project-requirements v1.1 (§3 ruff+D, §4 mypy strict,
# §5 coverage floor). New repos start strict; softening is a conversation, not a
# default.

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
# Keyed on the DISTRIBUTION name (reverie-engine), not the directory
# (packages/reverie) or the import name (reverie). All three differ on purpose.
reverie-engine = { workspace = true }

[dependency-groups]
# Dev tools only; real package deps live in member pyprojects.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.6",
    "diff-cover>=9.0",
    "ruff>=0.14",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [
    "packages/reverie/src",
]
extend-exclude = [
    ".venv",
    ".tmp",
]

[tool.ruff.lint]
select = [
    "F",
    "E",
    "I",
    "UP",
    "B",
    "RUF100",
    "D",
]
ignore = [
    "E501",
    # Google convention documents constructor args at class level and treats
    # magic methods as self-evident. Exempting these conforms to it rather
    # than weakening it.
    "D105",
    "D107",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
line-ending = "auto"
skip-magic-trailing-comma = false
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
files = [
    "packages/reverie/src",
]

[tool.pytest.ini_options]
testpaths = [
    "packages/reverie/tests",
]
asyncio_mode = "auto"
addopts = "--import-mode=importlib -m 'not slow' --cov=packages --cov-branch --cov-report=term --cov-report=xml --cov-fail-under=85 -n auto --dist=loadscope"
timeout = 60
# signal-based timeouts don't work on Windows
timeout_method = "thread"
markers = [
    "slow: >~1s OR real I/O (subprocess/network/sleep/heavy crypto); excluded from the default lane, run in the slow-tests CI job",
    "looptime: virtual asyncio clock compaction",
]

[tool.coverage.run]
omit = [
    "*/vendor/*",
    "*/.venv/*",
    "*/__pycache__/*",
]
